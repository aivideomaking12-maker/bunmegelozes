<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="liquid1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="liquid2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="liquid3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.25" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Liquid Ambient Blobs -->
  <path d="M-100,200 Q200,50 600,180 T1300,120 T1920,250 L1920,0 L0,0 Z" fill="url(#liquid1)" filter="url(#softGlow)" />
  <circle cx="250" cy="850" r="380" fill="url(#liquid2)" filter="url(#softGlow)" />
  <circle cx="1650" cy="750" r="450" fill="url(#liquid3)" filter="url(#softGlow)" />
  <path d="M0,900 C300,820 600,980 960,920 C1320,860 1620,950 1920,880 L1920,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.2" />
</svg>
