<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Emblem Shield -->
  <g filter="url(#shadow)">
    <path d="M 80 14 C 114 14 138 24 138 24 C 138 78 120 122 80 144 C 40 122 22 78 22 24 C 22 24 46 14 80 14 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 80 20 C 110 20 131 29 131 29 C 131 74 115 114 80 134 C 45 114 29 74 29 29 C 29 29 50 20 80 20 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- National Colors Ribbon Bar -->
  <rect x="52" y="44" width="56" height="5" rx="2" fill="#ef4444" />
  <rect x="52" y="49" width="56" height="5" rx="1" fill="#ffffff" />
  <rect x="52" y="54" width="56" height="5" rx="2" fill="#10b981" />

  <!-- Police Scales / Star / Emblem icon -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- Star of Justice -->
    <path d="M 80 66 L 83.5 76 L 94 76 L 85.5 82 L 89 92 L 80 86 L 71 92 L 74.5 82 L 66 76 L 76.5 76 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.2" />
    
    <!-- Balance / Sword / Laurel accent -->
    <circle cx="80" cy="79" r="3" fill="#ffffff" />
  </g>

  <!-- Text somogy vrk lettering -->
  <text x="80" y="112" font-family="sans-serif" font-weight="900" font-size="9" fill="#fef08a" text-anchor="middle" letter-spacing="1">SOMOGY</text>
  <text x="80" y="123" font-family="sans-serif" font-weight="800" font-size="7" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">RENDŐRSÉG</text>
</svg>
